
name: Build ESP8266 Weather Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download MicroPython
        run: |
          git clone https://github.com/micropython/micropython.git
          cd micropython
          git checkout v1.29.0
          git submodule update --init --recursive

      - name: Increase TLS buffer
        run: |
          cd micropython
          sed -i 's/-DRT_EXTRA=4096/-DRT_EXTRA=6144/' ports/esp8266/Makefile
          grep -q -- '-DRT_EXTRA=6144' ports/esp8266/Makefile

      - name: Compile firmware ELF
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            larsks/esp-open-sdk \
            sh -c '
              cd micropython &&
              make -C mpy-cross &&
              make -C ports/esp8266 \
                BOARD=ESP8266_GENERIC \
                build-ESP8266_GENERIC/firmware.elf
            '

      - name: Install modern esptool
        run: |
          python3 -m venv /tmp/esp-tools
          /tmp/esp-tools/bin/python -m pip install --upgrade pip setuptools wheel
          /tmp/esp-tools/bin/python -m pip install "esptool==4.8.1"
          /tmp/esp-tools/bin/python -m esptool version

      - name: Fix file permissions
        run: |
          sudo chown -R "$(id -u):$(id -g)" micropython

      - name: Generate firmware BIN
        run: |
          cd micropython/ports/esp8266

          /tmp/esp-tools/bin/python -m esptool \
            --chip esp8266 elf2image \
            build-ESP8266_GENERIC/firmware.elf

          python3 makeimg.py \
            build-ESP8266_GENERIC/firmware.elf-0x00000.bin \
            build-ESP8266_GENERIC/firmware.elf-0x[0-5][1-f]000.bin \
            build-ESP8266_GENERIC/firmware.bin

          test -s build-ESP8266_GENERIC/firmware.bin
          ls -lh build-ESP8266_GENERIC/firmware.bin

      - name: Verify firmware image
        run: |
          /tmp/esp-tools/bin/python -m esptool \
            image_info \
            micropython/ports/esp8266/build-ESP8266_GENERIC/firmware.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp8266-weather-custom
          path: micropython/ports/esp8266/build-ESP8266_GENERIC/firmware.bin
          if-no-files-found: error
