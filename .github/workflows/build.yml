
name: Build ESP8266 Weather Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: larsks/esp-open-sdk

    steps:
      - name: Download MicroPython
        run: |
          git clone --recursive https://github.com/micropython/micropython.git
          cd micropython
          git checkout v1.29.0
          git submodule update --init --recursive

      - name: Increase TLS buffer
        run: |
          cd micropython
          sed -i 's/-DRT_EXTRA=4096/-DRT_EXTRA=6144/' ports/esp8266/Makefile
          grep 'AXTLS_DEFS_EXTRA' ports/esp8266/Makefile

      - name: Build cross compiler
        run: |
          cd micropython
          make -C mpy-cross

      - name: Build firmware
        run: |
          cd micropython
          make -C ports/esp8266 BOARD=ESP8266_GENERIC

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp8266-weather-custom
          path: micropython/ports/esp8266/build-ESP8266_GENERIC/firmware.bin
          if-no-files-found: error
